# Builds the clients on every change to them: compiled, their unit tests run against the forges' recorded answers, and
# the shared checks of the root's validate. A push to main publishes the clients to Maven Central as a snapshot, a tag
# v<version> as a release; a release depends only on releases. Against porelo-parent as a snapshot while it is developed
# (-U takes the newest), as the shared rules allow.
name: Build

on:
    push:
        branches: [main]
        tags: ['v*']
        # A change to documents alone is checked locally before the hand-over and by the Shared rules check once a day.
        # Workflows alone build nothing either: an action's move is checked by its pull request, and the next push with
        # content builds with it.
        paths-ignore: ['**.md', 'doc/**', 'issues/**', '.github/**']
    pull_request:
        # A workflow-only change is the Workflow check's.
        paths-ignore: ['.github/**']
    workflow_dispatch:

permissions:
    contents: read

# Main publishes, and a publish cut off halfway leaves the clients' snapshots from two commits: there a run waits.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        name: Build and test
        # Pinned, not ubuntu-latest.
        runs-on: ubuntu-24.04
        # A run takes about 3 minutes; a slow runner must end, not run for GitHub's six hours.
        timeout-minutes: 35
        steps:
            # Every commit, so the pushed range can be read.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # validate runs check-actions, check-shared, check-citations and check-readmes, and refuses a dependency on
            # anything of Porelo.
            - name: Build, unit tests and the shared checks
              run: ./mvnw -B -U -s settings.xml verify

            # The live test's two images, pinned by digest in ForgejoContainer, the only place they are named: the cache's
            # key is the hash of both references, so a moved pin misses it and fetches anew. GitHub deletes an entry no
            # run has read for 7 days, so the old pin's entry goes by itself.
            - name: The Forgejo images' references
              id: forgejo-images
              run: |
                  set -eu
                  sed -n 's/^ *"\([a-z0-9.-]*\.[a-z]*\/[^"@ ]*@sha256:[0-9a-f]\{64\}\)";$/\1/p' \
                      clients/forgejo/src/test/java/org/fuin/porelo/forge/forgejo/ForgejoContainer.java \
                      >"$RUNNER_TEMP/forgejo-images"
                  cat "$RUNNER_TEMP/forgejo-images"
                  if [ "$(wc -l <"$RUNNER_TEMP/forgejo-images")" -ne 2 ]; then
                      echo "::error::ForgejoContainer.java names other than two images pinned by digest"
                      exit 1
                  fi
                  echo "key=forgejo-images-$(sha256sum "$RUNNER_TEMP/forgejo-images" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: forgejo-images-cache
              with:
                  path: ~/.cache/porelo-pinned/forgejo-images
                  key: ${{ steps.forgejo-images.outputs.key }}

            # An archive of podman save loses the digest, so podman would pull again: skopeo's OCI archive of the whole
            # index keeps it, and once loaded and named the image is found by its pinned reference. The fetch is tried
            # again by the rule of pinned.sh; a loaded image that is not the pinned one fails here.
            - name: The pinned Forgejo images
              run: |
                  set -eu
                  . .github/actions/pinned-jdk/pinned.sh
                  command -v skopeo >/dev/null || { echo "::error::skopeo is missing from the runner image"; exit 1; }
                  dir=$HOME/.cache/porelo-pinned/forgejo-images
                  mkdir -p "$dir"
                  fetch() { # <repository>@<digest> <archive>
                      rm -f "$2.part"
                      skopeo copy --quiet --all "docker://$1" "oci-archive:$2.part"
                      mv "$2.part" "$2"
                  }
                  while read -r ref; do
                      name=${ref%@*}
                      digest=${ref##*@}
                      repository=${name%:*}
                      [ "$name" != "$repository" ] || name=$repository:pinned
                      archive=$dir/${digest#sha256:}.tar
                      if [ -s "$archive" ]; then
                          echo "$ref taken from the cache" >&2
                      else
                          pinned_retry "the image $ref" fetch "$repository@$digest" "$archive"
                      fi
                      id=$(podman load -q -i "$archive" | sed -n 's/^Loaded image: //p' | tail -n 1)
                      podman tag "$id" "$name"
                      if ! podman image exists "$ref"; then
                          echo "::error::$archive does not hold $ref"
                          exit 1
                      fi
                  done <"$RUNNER_TEMP/forgejo-images"

            - if: steps.forgejo-images-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/porelo-pinned/forgejo-images
                  key: ${{ steps.forgejo-images.outputs.key }}

            # Every Forgejo call against a real Forgejo 17 and its runner in podman, which the runner image carries; the
            # containers reach the test's hook receiver through slirp4netns.
            - name: Forgejo's calls against a real Forgejo in podman
              timeout-minutes: 10
              run: |
                  set -eu
                  podman --version
                  command -v slirp4netns >/dev/null || { sudo apt-get update -q; sudo apt-get install -y --no-install-recommends slirp4netns; }
                  ./mvnw -B -s settings.xml -pl clients/forgejo -am -Dforgejo.live verify

            # A direct push to main never meets the pull request's check, so the push's own range is read here, by the
            # rule this commit carries. A tag checks the commit it names alone, a first commit too. The push that creates main names no start (all
            # zeros), so main's whole history is read. Another new branch or a branch pushed over has no start this checkout
            # holds, so its range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  range="$PUSH_BEFORE..$GITHUB_SHA"
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      range="$GITHUB_SHA^!"
                  elif [ "$GITHUB_REF" = refs/heads/main ] && [ -z "${PUSH_BEFORE//0/}" ]; then
                      range="$GITHUB_SHA"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      range="origin/main..$GITHUB_SHA"
                  fi
                  ./mvnw -B -s settings.xml -N exec:exec@release -Drelease.args="check-commits $range"

            # A release is refused unless the tag is exactly 'v' plus the version it carries, and that is no snapshot.
            - name: The tag names this commit's release
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                      || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                  case "$VERSION" in
                      *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                  esac

            # Every -SNAPSHOT in the effective pom - dependencies, the imported BOMs, plugins and their dependencies such as
            # porelo-release, inactive profiles too - refuses the tag.
            - name: A release depends only on releases
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  ./mvnw -B -s settings.xml help:effective-pom -Doutput=target/effective-pom.xml
                  ./mvnw -B -s settings.xml -N exec:exec@check-releases

            # Main publishes a snapshot, so the adapters build against the clients without a checkout of this one; a
            # version on main that is no snapshot would publish a release from a branch. A start by hand on main
            # publishes too, since a push of workflows alone starts no Build.
            - name: Main carries a snapshot
              if: >-
                  (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
                  && github.ref == 'refs/heads/main'
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  case "$VERSION" in
                      *-SNAPSHOT) ;;
                      *) echo "::error::$VERSION on main would publish a release as a snapshot"; exit 1 ;;
                  esac

            # Signed with the key from the environment by Bouncy Castle, so no key is imported into the runner's
            # keyring. The tests run again: this Maven resolves the snapshots it builds against anew, and publishes only
            # what passed with them.
            - name: Publish the clients to Central
              if: >-
                  (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
                  || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
                  && github.ref == 'refs/heads/main')
              env:
                  OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
                  OSS_SONATYPE_TOKEN: ${{ secrets.OSS_SONATYPE_TOKEN }}
                  MAVEN_GPG_KEY: ${{ secrets.OSS_SONATYPE_GPG_PRIVATE_KEY }}
                  MAVEN_GPG_PASSPHRASE: ${{ secrets.OSS_SONATYPE_GPG_PASSPHRASE }}
              run: ./mvnw -B -s settings.xml -Pcentral-sonatype-release -Dgpg.signer=bc clean deploy
